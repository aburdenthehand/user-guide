[build]
  publish = "./site"
  command = """
git fetch --depth=200;
pip install --upgrade pip;
pip install mkdocs mkdocs-awesome-nav mkdocs-material mkdocs-redirects mike;
sed -i 's|site_url: https://kubevirt.io/docs|site_url: https://kubevirt.io/|' /opt/build/repo/mkdocs.yml;
echo '*** BEGIN /opt/build/repo/mkdocs.yml ***';
cat /opt/build/repo/mkdocs.yml;
echo '*** END /opt/build/repo/mkdocs.yml ***';
git config user.name "Netlify Bot";
git config user.email "noreply@netlify.com";
mike deploy --config-file /opt/build/repo/mkdocs.yml --update-aliases v1.7 v1.7;
mike deploy --config-file /opt/build/repo/mkdocs.yml --update-aliases latest main;
mike set-default --config-file /opt/build/repo/mkdocs.yml latest;
mike build --config-file /opt/build/repo/mkdocs.yml
"""
